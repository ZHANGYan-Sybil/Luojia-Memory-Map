
<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>珞珈记忆地图</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    
<!-- LXGW WenKai: title font -->
<link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/lxgw-wenkai-webfont@1.7.0/lxgwwenkai-regular.css"
>

<!-- Project styles -->
<link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Top header -->
    <header class="site-header">
        <h1>珞珈记忆地图</h1>

        <p>
            点击地图上的任意位置，
            留下一段与这个地点有关的故事。
        </p>
    </header>

    <!-- Main map experience -->
    <main class="map-experience">

        <div id="map"></div>

        <!-- Memory counter overlay -->
        <div class="memory-summary">
            <span class="summary-label">这张地图收藏着</span>

            <div class="summary-number">
                <strong id="memoryCount">—</strong>
                <span>段记忆</span>
            </div>
        </div>

        <!-- Writing panel overlay -->
        <section
            id="memoryPanel"
            class="memory-panel hidden"
            aria-labelledby="panelTitle"
        >

            <div class="panel-heading">
                <div>
                    <span class="eyebrow">A PLACE TO REMEMBER</span>
                    <h2 id="panelTitle">
                        在这里，留下你的故事
                    </h2>
                </div>

                <button
                    id="panelCloseButton"
                    class="icon-close"
                    type="button"
                    aria-label="关闭书写窗口"
                >
                    ×
                </button>
            </div>

            <p class="location-info">
                <span>你选择的位置</span>
                <strong id="selectedLocation"></strong>
            </p>

            <label for="memoryInput">
                我的记忆
            </label>

            <textarea
                id="memoryInput"
                maxlength="500"
                rows="6"
                placeholder="在这个地方，发生过什么值得记住的事？"
            ></textarea>

            <p class="character-count">
                <span id="characterCount">0</span> / 500
            </p>

            <p
                id="errorMessage"
                class="error-message"
                role="alert"
            ></p>

            <div class="button-group">
                <button
                    id="cancelButton"
                    type="button"
                    class="cancel-button"
                >
                    取消
                </button>

                <button
                    id="saveButton"
                    type="button"
                    class="save-button"
                >
                    留下这段记忆
                </button>
            </div>

        </section>

        <!-- Status feedback -->
        <div
            id="statusMessage"
            class="status-message"
            role="status"
            aria-live="polite"
        ></div>

        <!-- Interaction guidance -->
        <div class="map-guidance">
            <span class="guidance-dot"></span>
            选择地点 · 点击加号 · 留下记忆
        </div>

    </main>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>

    <!-- Supabase JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Existing Supabase configuration -->
    <script src="config.js"></script>

    <!-- Application -->
    <script src="script.js"></script>

</body>
</html>


<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>珞珈记忆地图 | Luojia Memory Map</title>

    <!-- Leaflet CSS -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
        crossorigin=""
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="site-header">
        <h1>珞珈记忆地图</h1>
        <p>Luojia Memory Map · 每一个地点，都藏着一段故事。</p>
    </header>

    <main class="main-content">

        <section class="introduction">
            <h2>在地图上，遇见记忆</h2>
            <p>
                点击地图上的任意位置，
                留下一段与这个地点有关的故事。
            </p>
        </section>

        <!-- 地图 -->
        <div id="map"></div>

        <p class="map-tip">
            💡 拖动地图探索，单击任意位置即可留下记忆。
        </p>

        <!-- 记忆输入面板 -->
        <section id="memoryPanel" class="memory-panel hidden">

            <h3>在这里，留下你的故事</h3>

            <p class="location-info">
                你选择的位置：
                <span id="selectedLocation"></span>
            </p>

            <label for="memoryInput">我的记忆</label>

            <textarea
                id="memoryInput"
                maxlength="500"
                placeholder="这片地方，让你想起了什么？"
                rows="5"
            ></textarea>

            <p class="character-count">
                <span id="characterCount">0</span> / 500
            </p>

            <p id="errorMessage"
               class="error-message"
               role="alert"></p>

            <div class="button-group">

                <button id="cancelButton"
                        class="cancel-button">
                    取消
                </button>

                <button id="saveButton"
                        class="save-button">
                    留下这段记忆
                </button>

            </div>

        </section>

        <!-- 操作反馈 -->
        <p id="statusMessage"
           class="status-message"
           role="status"
           aria-live="polite"></p>

    </main>

    <footer>
        <p>Luojia Memory Map · An Interactive Experience</p>
    </footer>

    <!-- Leaflet JavaScript -->
    <script
        src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
        crossorigin="">
    </script>

    
<!-- Leaflet JavaScript: keep the existing Leaflet script above -->

<!-- Supabase JavaScript client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- Project configuration -->
<script src="config.js"></script>

<!-- Our application logic -->
<script src="script.js"></script>

</body>
</html>
